info:
  name: Create new user
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3333/api/users/register
  body:
    type: json
    data: |-
      {
        "name": "Peter Parker",
        "email": "paker@stark.com",
        "password": "123456789"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
